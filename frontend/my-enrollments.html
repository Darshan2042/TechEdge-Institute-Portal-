<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>My Enrollments - TechEdge</title>

    <link
            rel="stylesheet"
            href="css/style.css"

</head>

<body>

<header class="navbar">

    <div class="container nav-content">

        <a href="index.html" class="logo">

        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="courses.html">

            <a href="my-enrollments.html">

    <section class="section">

        <div class="container">
