<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Exam Result - TechEdge Institute</title>

    <link
            rel="stylesheet"
            href="css/style.css"
    >

</head>

<body>

<header class="navbar">

    <div class="container nav-content">

        <a href="dashboard.html" class="logo">
            TechEdge Institute
        </a>

        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="my-enrollments.html">
                My Enrollments
            </a>

            <button
                    type="button"
                    class="btn btn-outline"
                    onclick="logout()"
            >
                Logout
            </button>

        </nav>

    </div>

</header>


<main>

    <section class="section">

        <div class="container">

            <!-- Loading -->

            <div
                    id="loading"
                    class="card text-center"
            >
                <p>Loading result...</p>
            </div>


            <!-- Error -->

            <div
                    id="errorMessage"
                    class="error-message"
                    style="display: none;"
            >
            </div>


            <!-- Result -->

            <div
                    id="resultContainer"
                    style="display: none;"
            >

                <!-- Result Header -->

                <div class="section-header text-center">

                    <p>
                        Exam Result
                    </p>

                    <h1 id="examTitle">
                        Exam Result
                    </h1>

                </div>


                <!-- Result Summary -->

                <div class="card-grid">

                    <!-- Score -->

                    <div class="card text-center">

                        <h3>
                            Score
                        </h3>

                        <div
                                class="stat-value"
                                id="score"
                        >
                            -
                        </div>

                    </div>


                    <!-- Total Marks -->

                    <div class="card text-center">

                        <h3>
                            Total Marks
                        </h3>

                        <div
                                class="stat-value"
                                id="totalMarks"
                        >
                            -
                        </div>

                    </div>


                    <!-- Percentage -->

                    <div class="card text-center">

                        <h3>
                            Percentage
                        </h3>

                        <div
                                class="stat-value"
                                id="percentage"
                        >
                            -
                        </div>

                    </div>


                    <!-- Status -->

                    <div class="card text-center">

                        <h3>
                            Status
                        </h3>

                        <div
                                class="stat-value"
                                id="resultStatus"
                        >
                            -
                        </div>

                    </div>


                    <!-- Correct -->

                    <div class="card text-center">

                        <h3>
                            Correct
                        </h3>

                        <div
                                class="stat-value"
                                id="correctCount"
                        >
                            -
                        </div>

                    </div>


                    <!-- Wrong -->

                    <div class="card text-center">

                        <h3>
                            Wrong
                        </h3>

                        <div
                                class="stat-value"
                                id="wrongCount"
                        >
                            -
                        </div>

                    </div>


                    <!-- Unanswered -->

                    <div class="card text-center">

                        <h3>
                            Unanswered
                        </h3>

                        <div
                                class="stat-value"
                                id="unansweredCount"
                        >
                            -
                        </div>

                    </div>

                </div>


                <!-- Question Review -->

                <div class="detail-section">

                    <h2>
                        Question Review
                    </h2>

                    <div
                            id="answersContainer"
                            class="exam-questions"
                    >
                    </div>

                </div>


                <!-- Navigation -->

                <div
                        class="text-center"
                        style="margin-top: 40px;"
                >

                    <a
                            href="dashboard.html"
                            class="btn btn-primary"
                    >
                        Back to Dashboard
                    </a>


                    <a
                            href="my-enrollments.html"
                            class="btn btn-secondary"
                    >
                        My Enrollments
                    </a>

                </div>

            </div>

        </div>

    </section>

</main>


<footer class="footer">

    <div class="container text-center">

        <p>
            © 2026 TechEdge Institute.
            All rights reserved.
        </p>

    </div>

</footer>


<!-- JavaScript -->

<script src="js/config.js"></script>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

<script src="js/result.js"></script>

</body>

</html>
