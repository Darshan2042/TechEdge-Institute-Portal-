<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Courses - TechEdge Institute</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="container nav-content">

        <a href="index.html" class="logo">
            TechEdge
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="courses.html">Courses</a>
            <a href="offers.html">Offers</a>
            <a href="placements.html">Placements</a>
            <a href="about.html">About</a>
            <a href="login.html" id="loginLink">Login</a>

            <button
                    id="logoutBtn"
                    class="btn btn-outline"
                    style="display:none"
                    onclick="logout()"
            >
                Logout
            </button>
        </nav>

    </div>

</header>


<main>

    <section class="section">

        <div class="container">

            <div class="section-header">

                <span class="badge">
                    Our Courses
                </span>

                <h1>
                    Explore Courses
                </h1>

                <p>
                    Find the right course and start building
                    your skills.
                </p>

            </div>


            <!-- Filters -->

            <div class="filters">

                <input
                        type="text"
                        id="searchInput"
                        placeholder="Search courses..."
                >

                <select id="categoryFilter">

                    <option value="">
                        All Categories
                    </option>

                    <option value="TECHNICAL">
                        Technical
                    </option>

                    <option value="APTITUDE">
                        Aptitude
                    </option>

                    <option value="COMMUNICATION">
                        Communication
                    </option>

                </select>


                <select id="levelFilter">

                    <option value="">
                        All Levels
                    </option>

                    <option value="BEGINNER">
                        Beginner
                    </option>

                    <option value="INTERMEDIATE">
                        Intermediate
                    </option>

                    <option value="ADVANCED">
                        Advanced
                    </option>

                </select>

                <button
                        class="btn btn-primary"
                        onclick="loadCourses()"
                >
                    Search
                </button>

            </div>


            <!-- Loading -->

            <div id="loading">
                Loading courses...
            </div>


            <!-- Error -->

            <div
                    id="errorMessage"
                    class="error-message"
                    style="display:none"
            ></div>


            <!-- Courses -->

            <div
                    id="courseContainer"
                    class="card-grid"
            ></div>


            <!-- Pagination -->

            <div
                    id="pagination"
                    class="pagination"
            ></div>

        </div>

    </section>

</main>


<footer class="footer">

    <div class="container">

        <p>
            © 2026 TechEdge Institute. All rights reserved.
        </p>

    </div>

</footer>


<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/courses.js"></script>

</body>

</html>
